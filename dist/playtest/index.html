<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Playtest</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #e0e7ff, #f8fafc);
      font-family: Arial, sans-serif;
    }

    .container {
      background: white;
      padding: 40px 60px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      text-align: center;
    }

    h1 {
      margin-bottom: 30px;
      font-size: 2.5rem;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    a {
      text-decoration: none;
      font-size: 1.5rem;
      color: #1e293b;
      padding: 12px 20px;
      border-radius: 10px;
      transition: all 0.2s ease;
      background: #f1f5f9;
    }

    a:hover {
      background: #6366f1;
      color: white;
      transform: translateY(-2px);
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>To The Fairyland Playtest</h1>

    <div class="links">
      <a href="https://to-the-fairyland.firebaseapp.com/" target="_blank">
        Enter Fairyland
      </a>

      <a href="https://to-the-fairyland.firebaseapp.com/benchmark1" target="_blank">
        Benchmark 1
      </a>

      <a href="https://to-the-fairyland.firebaseapp.com/benchmark2" target="_blank">
        Benchmark 2
      </a>

      <a href="https://to-the-fairyland.firebaseapp.com/benchmark3" target="_blank">
        Benchmark 3
      </a>
    </div>
  </div>
</body>
</html>
