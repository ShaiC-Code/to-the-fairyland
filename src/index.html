<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>To The Fairyland</title>
    <style>
      #main {
        display: flex;
        flex-direction: row;
        justify-content: center;
      }

      #game-window {
        position: relative;
      }

      #transition-overlay {
        position: absolute;
        inset: 0;
        z-index: 25;
        opacity: 0;
        background: #000;
        pointer-events: none;
      }

      #loading-overlay {
        position: absolute;
        inset: 0;
        z-index: 30;
        display: flex;
        align-items: flex-end;
        justify-content: flex-end;
        padding: 20px;
        pointer-events: none;
      }

      #loading-overlay[hidden] {
        display: none;
      }

      .loading-card {
        width: 320px;
        padding: 18px 20px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 10px;
        background: rgba(14, 18, 30, 0.94);
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.35);
        color: #f5f7ff;
        font-family: "NoPixel", monospace;
      }

      .loading-title {
        margin: 0 0 10px 0;
        letter-spacing: 0.5px;
        font-size: 20px;
      }

      .loading-subtitle {
        margin: 0 0 12px 0;
        font-size: 12px;
        color: rgba(245, 247, 255, 0.78);
      }

      .loading-bar {
        width: 100%;
        height: 12px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.1);
        overflow: hidden;
      }

      .loading-bar-fill {
        width: 0%;
        height: 100%;
        background: white;
        transition: width 120ms linear;
      }

      .loading-percent {
        margin-top: 8px;
        text-align: right;
        font-size: 11px;
        color: rgba(245, 247, 255, 0.82);
      }

      #game-canvas {
        width: 100%;
        height: 100%;
        position: absolute;
        top: 0px;
        left: 0px;
      }

      #text-canvas {
        width: 100%;
        height: 100%;
        position: absolute;
        top: 0px;
        left: 0px;
        pointer-events: none;
      }

      #debug-canvas {
        width: 100%;
        height: 100%;
        position: absolute;
        top: 0px;
        left: 0px;
        pointer-events: none;
      }

      @font-face {
        font-family: 'NoPixel';
        src: url('assets/fonts/NoPixel.ttf');
      }
    </style>
  </head>
  <body>
    <div id="main">
      <!-- The main window of the game. This contains the rendered game and any debug text -->
      <div id="game-window">
        <!-- This is the canvas where the actual game is rendered -->
        <canvas id="game-canvas"></canvas>
        <!-- This is the canvas where text is rendered in WebGL -->
        <canvas id="text-canvas" hidden></canvas>
        <!-- This is the canvas where the debug text and graphics are rendered -->
        <canvas id="debug-canvas"></canvas>
        <!-- This darkens the screen for fade transitions between selected scene changes -->
        <div id="transition-overlay" hidden></div>
        <!-- This is shown while resources are loading between scene swaps -->
        <div id="loading-overlay" hidden>
          <div class="loading-card">
            <h2 class="loading-title">Loading</h2>
            <p class="loading-subtitle">Preparing the next scene...</p>
            <div class="loading-bar">
              <div id="loading-bar-fill" class="loading-bar-fill"></div>
            </div>
            <div id="loading-percent" class="loading-percent">0%</div>
          </div>
        </div>
      </div>

      <!-- This contains stats about the game for development purposes, such as the average update time -->
      <div id="stats" hidden>
        <canvas id="stats-canvas"></canvas>
        <select name="Display" id="chart-option">
        </select>
        <div id="stats-display"></div>
      </div>
    </div>
    <script src="bundle.js"></script>
  </body>
</html>
