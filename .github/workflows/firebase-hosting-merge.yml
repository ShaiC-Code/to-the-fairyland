name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - run: npm ci
      - run: npm run build
      - run: gulp build --benchmark=benchmark1 --commit=benchmark1
      - run: gulp build --benchmark=benchmark2 --commit=benchmark2
      - run: gulp build --benchmark=benchmark3 --commit=benchmark3
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TO_THE_FAIRYLAND }}
          channelId: live
          projectId: to-the-fairyland
